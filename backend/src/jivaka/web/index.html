<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>Jivaka — Ingestion</title>
<style>
  :root {
    color-scheme: light dark;
    --bg: #ffffff;
    --fg: #1a1a1a;
    --muted: #6b7280;
    --border: #d8dde3;
    --accent: #2563eb;
    --danger: #dc2626;
    --success: #16a34a;
    --warning: #b45309;
    --panel: #f7f8fa;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #14171c;
      --fg: #e6e8eb;
      --muted: #9aa3af;
      --border: #2c3138;
      --accent: #60a5fa;
      --danger: #f87171;
      --success: #4ade80;
      --warning: #fbbf24;
      --panel: #1b1f26;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    padding: 2rem 1.5rem 4rem;
    background: var(--bg);
    color: var(--fg);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
    line-height: 1.5;
  }
  .wrap { max-width: 860px; margin: 0 auto; }
  h1 { font-size: 1.4rem; margin-bottom: 0.25rem; }
  .subtitle { color: var(--muted); margin-top: 0; margin-bottom: 2rem; font-size: 0.9rem; }
  .panel {
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 1.25rem;
    margin-bottom: 1.5rem;
  }
  .panel h2 { margin-top: 0; font-size: 1.05rem; }
  label { display: block; font-size: 0.85rem; color: var(--muted); margin-bottom: 0.3rem; }
  input[type="file"], select {
    width: 100%;
    padding: 0.5rem;
    border: 1px solid var(--border);
    border-radius: 6px;
    background: var(--bg);
    color: var(--fg);
    margin-bottom: 1rem;
  }
  button {
    background: var(--accent);
    color: white;
    border: none;
    border-radius: 6px;
    padding: 0.55rem 1.1rem;
    font-size: 0.95rem;
    cursor: pointer;
  }
  button:disabled { opacity: 0.5; cursor: not-allowed; }
  .status-line { display: flex; align-items: center; gap: 0.6rem; margin-top: 1rem; font-size: 0.9rem; }
  .spinner {
    width: 14px; height: 14px;
    border: 2px solid var(--border);
    border-top-color: var(--accent);
    border-radius: 50%;
    animation: spin 0.8s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
  .error { color: var(--danger); font-weight: 500; }
  .success { color: var(--success); font-weight: 500; }
  table { border-collapse: collapse; width: 100%; margin-top: 0.75rem; font-size: 0.9rem; }
  th, td { text-align: left; padding: 0.35rem 0.6rem; border-bottom: 1px solid var(--border); }
  th { color: var(--muted); font-weight: 600; font-size: 0.8rem; text-transform: uppercase; }
  .tree { margin-top: 1rem; font-size: 0.9rem; }
  .tree-doc { font-weight: 600; margin-bottom: 0.5rem; }
  .tree-chunk { margin: 0.6rem 0 0.3rem; padding-left: 0.5rem; border-left: 2px solid var(--border); }
  .tree-chunk-label { color: var(--muted); font-size: 0.85rem; }
  .tree-entity { margin-left: 1.2rem; padding: 0.15rem 0; }
  .tree-entity .type { color: var(--accent); font-size: 0.8rem; text-transform: uppercase; margin-right: 0.4rem; }
  .tree-entity .def { color: var(--muted); }
  .doc-list { list-style: none; padding: 0; margin: 0; }
  .doc-list li {
    padding: 0.5rem 0.6rem;
    border-radius: 6px;
    cursor: pointer;
    display: flex;
    justify-content: space-between;
    gap: 1rem;
    font-size: 0.88rem;
  }
  .doc-list li:hover { background: var(--border); }
  .doc-list .meta { color: var(--muted); white-space: nowrap; display: flex; align-items: center; gap: 0.5rem; }
  .doc-list .name { min-width: 0; overflow-wrap: anywhere; }
  .doc-list .detail { display: block; color: var(--danger); font-size: 0.8rem; }
  .badge {
    display: inline-flex; align-items: center; gap: 0.35rem;
    padding: 0.05rem 0.5rem; border-radius: 999px; font-size: 0.78rem;
    border: 1px solid currentColor; white-space: nowrap;
  }
  .badge.running { color: var(--accent); }
  .badge.done { color: var(--success); }
  .badge.failed { color: var(--danger); }
  .badge.cancelled, .badge.queued { color: var(--muted); }
  .badge.interrupted { color: var(--warning); }
  .badge .spinner { width: 10px; height: 10px; border-width: 2px; }
  button.link {
    background: none; color: var(--danger); padding: 0; font-size: 0.8rem;
    text-decoration: underline;
  }
  .empty { color: var(--muted); font-size: 0.88rem; }
</style>
</head>
<body>
<div class="wrap">
  <h1>Jivaka</h1>
  <p class="subtitle">Upload a document to build its portion of the trinity knowledge graph. · <a href="/chat" style="color: var(--accent);">Ask questions in chat</a></p>

  <div class="panel">
    <h2>Ingest a document</h2>
    <form id="ingest-form">
      <label for="file">Document</label>
      <input type="file" id="file" name="file" accept=".pdf,.txt,.text,.md,.markdown,.html,.htm,.xhtml,.xml,.json,.jsonl,.ndjson,.csv,.tsv,.png,.jpg,.jpeg,.tiff,.epub,.mobi" required />

      <label for="doc_type">Document type</label>
      <select id="doc_type" name="doc_type">
        <option value="patient_record">patient_record</option>
        <option value="textbook">textbook</option>
      </select>

      <button type="submit" id="submit-btn">Ingest</button>
    </form>
    <div id="status-line"></div>
  </div>

  <div class="panel" id="result-panel" style="display:none;">
    <h2>Result</h2>
    <table id="summary-table"></table>
    <div id="graph-tree" class="tree"></div>
  </div>

  <div class="panel">
    <h2>Recent documents</h2>
    <ul class="doc-list" id="doc-list"><li class="empty">Loading…</li></ul>
  </div>
</div>

<script>
const API = "";

function truncate(text, len = 60) {
  text = (text || "").replace(/\s+/g, " ").trim();
  return text.length <= len ? text : text.slice(0, len - 1) + "…";
}

function el(tag, attrs = {}, children = []) {
  const node = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs)) {
    if (k === "class") node.className = v;
    else if (k === "text") node.textContent = v;
    else node.setAttribute(k, v);
  }
  for (const child of children) node.appendChild(child);
  return node;
}

// Uploads get a "<32 hex>_" prefix on disk to keep them unique; hide it.
function displayName(name) {
  return (name || "").replace(/^[0-9a-f]{32}_/, "");
}

function badge(status, text) {
  const node = el("span", { class: `badge ${status}` });
  if (status === "running" || status === "queued") node.appendChild(el("span", { class: "spinner" }));
  node.appendChild(document.createTextNode(text || status));
  return node;
}

function formatTime(value) {
  return new Date(value).toLocaleString();
}

// Jobs submitted from this tab, so their result can be shown when they finish.
const myJobs = new Set();
let lastListSignature = "";
let refreshTimer = null;

async function cancelJob(job) {
  if (!confirm(`Stop ingesting ${displayName(job.filename)}? What it has added so far will be removed.`)) return;
  await fetch(`${API}/jobs/${job.id}/cancel`, { method: "POST" });
  loadRecentDocuments();
}

function jobRow(job) {
  let status = job.status;
  let text = job.status;
  if (job.status === "running" || job.status === "queued") {
    if (job.cancel_requested) text = "cancelling…";
    else if (job.progress) text = `${job.status} · ${job.progress}`;
  }
  const name = el("span", { class: "name", text: displayName(job.filename) });
  if (job.status === "failed" && job.error) {
    name.appendChild(el("span", { class: "detail", text: job.error }));
  }
  const meta = el("span", { class: "meta" }, [
    badge(status, text),
    el("span", { text: `${job.doc_type} · ${formatTime(job.created_at * 1000)}` }),
  ]);
  if ((job.status === "running" || job.status === "queued") && !job.cancel_requested) {
    const btn = el("button", { class: "link", type: "button", text: "Cancel" });
    btn.addEventListener("click", (evt) => {
      evt.stopPropagation();
      cancelJob(job);
    });
    meta.appendChild(btn);
  }
  const item = el("li", {}, [name, meta]);
  if (job.doc_id) item.addEventListener("click", () => showGraph(job.doc_id));
  return item;
}

async function deleteDocument(doc) {
  const name = displayName(doc.filename) || doc.id;
  if (!confirm(`Delete the interrupted ingest of ${name}? Everything it added to the graph will be removed.`)) return;
  const res = await fetch(`${API}/documents/${doc.id}`, { method: "DELETE" });
  if (res.ok) {
    setStatusText("", `Deleted: ${name}.`);
  } else {
    const body = await res.json().catch(() => ({}));
    setStatusText("error", body.detail || `Could not delete ${name}.`);
  }
  loadRecentDocuments();
}

function docRow(doc) {
  const status = doc.status === "incomplete" ? "interrupted" : "done";
  const item = el("li", {}, [
    el("span", { class: "name", text: displayName(doc.filename) || doc.id }),
    el("span", { class: "meta" }, [
      badge(status),
      el("span", { text: `${doc.doc_type} · ${formatTime(doc.ingested_at)}` }),
    ]),
  ]);
  if (status === "interrupted") {
    item.title = "Ingestion stopped before finishing (for example the server restarted). Upload the same file again to continue where it stopped, or delete it.";
    const btn = el("button", { class: "link", type: "button", text: "Delete" });
    btn.addEventListener("click", (evt) => {
      evt.stopPropagation();
      deleteDocument(doc);
    });
    item.querySelector(".meta").appendChild(btn);
  }
  item.addEventListener("click", () => showGraph(doc.id));
  return item;
}

async function handleFinishedJobs(jobs) {
  for (const job of jobs) {
    if (!myJobs.has(job.id) || job.status === "queued" || job.status === "running") continue;
    myJobs.delete(job.id);
    const name = displayName(job.filename);
    if (job.status === "succeeded") {
      setStatusText(
        "success",
        job.result.duplicate
          ? `Already ingested: ${name} was uploaded before, so it's showing the existing document instead of adding a copy.`
          : job.result.resumed_chunks
            ? `Done: ${name}. Continued where the earlier run stopped (${job.result.resumed_chunks} of ${job.result.chunk_count} chunks were already done).`
            : `Done: ${name}.`
      );
      await showGraph(job.result.document.id, job.result);
    } else if (job.status === "failed") {
      setStatusText("error", `Failed: ${name}: ${job.error || "unknown error"}`);
    } else if (job.status === "cancelled") {
      setStatusText("", `Cancelled: ${name}.`);
    }
  }
}

async function loadRecentDocuments() {
  clearTimeout(refreshTimer);
  const list = document.getElementById("doc-list");
  let jobs = [];
  let docs = [];
  try {
    const [jobsRes, docsRes] = await Promise.all([fetch(`${API}/jobs`), fetch(`${API}/documents`)]);
    jobs = jobsRes.ok ? await jobsRes.json() : [];
    docs = await docsRes.json();
  } catch (e) {
    list.innerHTML = "";
    list.appendChild(el("li", { class: "error", text: "Failed to load documents." }));
    refreshTimer = setTimeout(loadRecentDocuments, 5000);
    return;
  }

  // Finished jobs show up as documents; the rest get their own row, and
  // their (incomplete) document row is hidden so the file isn't listed twice.
  const shownJobs = jobs.filter((j) => j.status !== "succeeded");
  const jobDocIds = new Set(shownJobs.map((j) => j.doc_id).filter(Boolean));
  const shownDocs = docs.filter((d) => !jobDocIds.has(d.id));

  const signature = JSON.stringify([shownJobs, shownDocs]);
  if (signature !== lastListSignature) {
    lastListSignature = signature;
    list.innerHTML = "";
    if (shownJobs.length === 0 && shownDocs.length === 0) {
      list.appendChild(el("li", { class: "empty", text: "No documents ingested yet." }));
    }
    for (const job of shownJobs) list.appendChild(jobRow(job));
    for (const doc of shownDocs) list.appendChild(docRow(doc));
  }

  await handleFinishedJobs(jobs);

  const active = jobs.some((j) => j.status === "queued" || j.status === "running");
  if (active || myJobs.size > 0) refreshTimer = setTimeout(loadRecentDocuments, 2000);
}

function renderSummary(result) {
  const table = document.getElementById("summary-table");
  table.innerHTML = "";
  const rows = [
    ["doc_id", result.document.id],
    ["chunks", result.chunk_count],
    ["entities", result.entity_count],
    ["relations", result.relation_count],
    ["definitions matched", result.definitions_matched],
    ["definitions missing", result.definitions_missing],
    ["OCR pages used", result.ocr_pages_used],
    ...(result.resumed_chunks ? [["chunks reused from earlier run", result.resumed_chunks]] : []),
    ["elapsed (s)", result.elapsed_seconds.toFixed(2)],
  ];
  for (const [label, value] of rows) {
    table.appendChild(el("tr", {}, [el("td", { text: label }), el("td", { text: String(value) })]));
  }
}

function renderTree(dump) {
  const container = document.getElementById("graph-tree");
  container.innerHTML = "";
  container.appendChild(
    el("div", { class: "tree-doc", text: `Document: ${dump.document.filename} (${dump.document.id})` })
  );

  for (const entry of dump.chunks) {
    const chunk = entry.chunk;
    container.appendChild(
      el("div", { class: "tree-chunk-label", text: `Chunk #${chunk.order}: ${truncate(chunk.text)}` })
    );
    const chunkBox = el("div", { class: "tree-chunk" });
    for (const e of entry.entities) {
      const entity = e.entity;
      const def = e.definition;
      const line = el("div", { class: "tree-entity" }, [
        el("span", { class: "type", text: entity.entity_type }),
        el("span", { text: entity.name }),
      ]);
      line.appendChild(
        el("span", {
          class: "def",
          text: def ? ` → ${truncate(def.definition_text, 80)}` : " → (no definition)",
        })
      );
      chunkBox.appendChild(line);
    }
    container.appendChild(chunkBox);
  }

  if (dump.relations && dump.relations.length > 0) {
    const table = el("table", {}, [
      el("tr", {}, [el("th", { text: "source" }), el("th", { text: "relation" }), el("th", { text: "target" })]),
    ]);
    for (const rel of dump.relations) {
      table.appendChild(
        el("tr", {}, [
          el("td", { text: rel.source_name }),
          el("td", { text: rel.relation_type }),
          el("td", { text: rel.target_name }),
        ])
      );
    }
    container.appendChild(el("h2", { text: "Entity relations" }));
    container.appendChild(table);
  }
}

async function showGraph(docId, resultForSummary) {
  const res = await fetch(`${API}/documents/${docId}/graph`);
  if (!res.ok) return;
  const dump = await res.json();
  document.getElementById("result-panel").style.display = "block";
  if (resultForSummary) renderSummary(resultForSummary);
  else document.getElementById("summary-table").innerHTML = "";
  renderTree(dump);
}

function setStatus(html) {
  document.getElementById("status-line").innerHTML = html;
}

function setStatusText(cls, text) {
  const line = document.getElementById("status-line");
  line.innerHTML = "";
  line.appendChild(el("span", { class: cls, text }));
}

document.getElementById("ingest-form").addEventListener("submit", async (evt) => {
  evt.preventDefault();
  const fileInput = document.getElementById("file");
  const docType = document.getElementById("doc_type").value;
  if (!fileInput.files.length) return;

  const formData = new FormData();
  formData.append("file", fileInput.files[0]);
  formData.append("doc_type", docType);

  document.getElementById("submit-btn").disabled = true;
  setStatus(`<span class="spinner"></span> <span>Uploading…</span>`);

  try {
    const res = await fetch(`${API}/ingest`, { method: "POST", body: formData });
    if (!res.ok) {
      const body = await res.json().catch(() => ({}));
      setStatus(`<span class="error">${body.detail || "Upload failed."}</span>`);
      document.getElementById("submit-btn").disabled = false;
      return;
    }
    const { job_id } = await res.json();
    myJobs.add(job_id);
    setStatusText("", `Started ingesting ${fileInput.files[0].name}. Its progress shows in Recent documents below.`);
    fileInput.value = "";
    document.getElementById("submit-btn").disabled = false;
    loadRecentDocuments();
  } catch (e) {
    setStatus(`<span class="error">Network error while uploading.</span>`);
    document.getElementById("submit-btn").disabled = false;
  }
});

loadRecentDocuments();
</script>
</body>
</html>
