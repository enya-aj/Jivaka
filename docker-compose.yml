services:
  falkordb:
    image: falkordb/falkordb:latest
    ports:
      - "6379:6379"
      - "3000:3000"
    volumes:
      - falkordb_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  ollama:
    image: ollama/ollama:latest
    ports:
      - "11434:11434"
    volumes:
      - ollama_models:/root/.ollama
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 5s
      timeout: 3s
      retries: 10

  ollama-pull:
    image: ollama/ollama:latest
    depends_on:
      ollama:
        condition: service_healthy
    environment:
      - OLLAMA_HOST=http://ollama:11434
      - OLLAMA_MODEL=${OLLAMA_MODEL:?set OLLAMA_MODEL in .env}
    entrypoint: ["/bin/sh", "-c", "ollama pull \"$$OLLAMA_MODEL\""]
    restart: "no"

  backend:
    build:
      context: ./backend
    depends_on:
      falkordb:
        condition: service_healthy
      ollama:
        condition: service_healthy
    ports:
      - "8000:8000"
    environment:
      - FALKOR_HOST=falkordb
      - FALKOR_PORT=6379
      - FALKOR_GRAPH_NAME=${FALKOR_GRAPH_NAME:-jivaka}
      - OLLAMA_HOST=http://ollama:11434
      - OLLAMA_MODEL=${OLLAMA_MODEL:?set OLLAMA_MODEL in .env}
      - DEFINITION_SOURCE=${DEFINITION_SOURCE:-stub}
      - UPLOAD_DIR=/app/data/uploads
      - OCR_TEXT_DENSITY_THRESHOLD=${OCR_TEXT_DENSITY_THRESHOLD:-0.02}
    volumes:
      - ./data/uploads:/app/data/uploads
      - ./data/reference:/app/data/reference
      - easyocr_models:/root/.EasyOCR

volumes:
  falkordb_data:
  ollama_models:
  easyocr_models:
