services:
  falkordb:
    image: falkordb/falkordb:latest
    # Bound to localhost by default: FalkorDB has no password, and an open
    # 6379 gets found and abused by internet scanners within days. The
    # backend reaches it over the compose network either way. Use an SSH
    # tunnel to reach the browser UI from another machine.
    ports:
      - "${FALKOR_BIND_ADDRESS:-127.0.0.1}:${FALKOR_PORT:-6379}:6379"
      - "${FALKOR_BIND_ADDRESS:-127.0.0.1}:${FALKOR_UI_PORT:-3000}:3000"
    volumes:
      # The image saves dump.rdb under /var/lib/falkordb/data (/data/data is
      # only a symlink to it), so the volume has to be mounted there for the
      # graph to survive the container being recreated.
      - falkordb_data:/var/lib/falkordb/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  # Only started when the "ollama-managed" profile is active (the default -
  # see COMPOSE_PROFILES in .env.example). Skip it on hosts that already run
  # Ollama natively/elsewhere by clearing COMPOSE_PROFILES and pointing
  # OLLAMA_HOST at that instance instead.
  ollama:
    image: ollama/ollama:latest
    profiles: ["ollama-managed"]
    ports:
      - "${FALKOR_BIND_ADDRESS:-127.0.0.1}:11434:11434"
    volumes:
      - ollama_models:/root/.ollama
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 5s
      timeout: 3s
      retries: 10

  ollama-pull:
    image: ollama/ollama:latest
    profiles: ["ollama-managed"]
    depends_on:
      ollama:
        condition: service_healthy
    environment:
      - OLLAMA_HOST=http://ollama:11434
      - OLLAMA_MODEL=${OLLAMA_MODEL:?set OLLAMA_MODEL in .env}
    entrypoint: ["/bin/sh", "-c", "ollama pull \"$$OLLAMA_MODEL\""]
    restart: "no"

  backend:
    build:
      context: ./backend
    depends_on:
      falkordb:
        condition: service_healthy
      ollama:
        condition: service_healthy
        required: false
    extra_hosts:
      # Lets OLLAMA_HOST=http://host.docker.internal:PORT reach a native/
      # host-level Ollama on Linux too (works out of the box on Docker
      # Desktop for Mac/Windows already).
      - "host.docker.internal:host-gateway"
    ports:
      # Set BACKEND_BIND_ADDRESS=127.0.0.1 once Caddy serves HTTPS in front
      # (the "https" profile), so the API is only reachable through it.
      - "${BACKEND_BIND_ADDRESS:-0.0.0.0}:${BACKEND_PORT:-8000}:8000"
    environment:
      - FALKOR_HOST=falkordb
      - FALKOR_PORT=6379
      - FALKOR_GRAPH_NAME=${FALKOR_GRAPH_NAME:-jivaka}
      - OLLAMA_HOST=${OLLAMA_HOST:-http://ollama:11434}
      - OLLAMA_MODEL=${OLLAMA_MODEL:?set OLLAMA_MODEL in .env}
      - DEFINITION_SOURCE=${DEFINITION_SOURCE:-stub}
      - UPLOAD_DIR=/app/data/uploads
      - OCR_TEXT_DENSITY_THRESHOLD=${OCR_TEXT_DENSITY_THRESHOLD:-0.005}
      - INGEST_MAX_CONCURRENCY=${INGEST_MAX_CONCURRENCY:-2}
      - INGEST_EXTRACTION_RETRIES=${INGEST_EXTRACTION_RETRIES:-1}
      - TEXTBOOK_CHUNK_MAX_CHARS=${TEXTBOOK_CHUNK_MAX_CHARS:-1500}
      - PATIENT_RECORD_CHUNK_MAX_CHARS=${PATIENT_RECORD_CHUNK_MAX_CHARS:-1200}
      - DEID_USE_NER=${DEID_USE_NER:-true}
      - DEID_EXTRA_ID_PATTERNS=${DEID_EXTRA_ID_PATTERNS:-[]}
      - RETRIEVAL_TOP_K=${RETRIEVAL_TOP_K:-6}
      - INGEST_LLM_PROVIDER=${INGEST_LLM_PROVIDER:-ollama}
      - OPENROUTER_API_KEY=${OPENROUTER_API_KEY:-}
      - OPENROUTER_MODEL=${OPENROUTER_MODEL:-}
      - OPENROUTER_MAX_CONCURRENCY=${OPENROUTER_MAX_CONCURRENCY:-16}
      - OPENROUTER_DENY_DATA_COLLECTION=${OPENROUTER_DENY_DATA_COLLECTION:-true}
      - OPENROUTER_FOR_PATIENT_RECORDS=${OPENROUTER_FOR_PATIENT_RECORDS:-false}
      - AUTH_ENABLED=${AUTH_ENABLED:-true}
      - GOOGLE_CLIENT_ID=${GOOGLE_CLIENT_ID:-}
      - GOOGLE_CLIENT_SECRET=${GOOGLE_CLIENT_SECRET:-}
      - PUBLIC_BASE_URL=${PUBLIC_BASE_URL:-http://localhost:8000}
      - ADMIN_EMAILS=${ADMIN_EMAILS:-}
      - APP_DB_PATH=/app/data/app/jivaka.db
      - SESSION_DAYS=${SESSION_DAYS:-14}
      - COOKIE_SECURE=${COOKIE_SECURE:-true}
    volumes:
      - ./data/uploads:/app/data/uploads
      # Users, sign-in sessions and chat history (SQLite).
      - ./data/app:/app/data/app
      - ./data/reference:/app/data/reference
      - easyocr_models:/root/.EasyOCR

  # HTTPS in front of the backend, with a certificate from Let's Encrypt.
  # Needed for Google sign-in, which refuses plain-http addresses other than
  # localhost. Start it with COMPOSE_PROFILES=...,https and SITE_ADDRESS set
  # to the public host name (e.g. 187-127-210-88.sslip.io). Ports 80 and 443
  # must be reachable from the internet for the certificate to be issued.
  caddy:
    image: caddy:2.8
    profiles: ["https"]
    depends_on:
      - backend
    ports:
      - "80:80"
      - "443:443"
    environment:
      - SITE_ADDRESS=${SITE_ADDRESS:?set SITE_ADDRESS in .env for the https profile}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    restart: unless-stopped

volumes:
  caddy_data:
  caddy_config:
  falkordb_data:
  ollama_models:
  easyocr_models:
