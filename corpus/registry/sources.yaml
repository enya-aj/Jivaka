# schema_version: 1
#
# Source-of-truth registry for Jivaka's corpus data-acquisition tool.
# Populated from the zoac-zeus-jivaka submodule's research (see
# -data/_manifest.tsv, -data/data-index.md, -data/_blocked/README.md,
# ai/system-design/data-sources/*.md). This tool owns this file; it is
# never edited back into the submodule.
#
# Fields:
#   name                   unique id, also used as the manifest lookup key
#   category               vocabulary | corpus | patient-record
#   license_class          green (production-safe) | amber (non-commercial-only,
#                          or license unconfirmed) | red (no redistribution)
#   url                    source URL
#   dest                   path under archive/ (relative), null if not fetchable
#   expected_content_type  list of acceptable Content-Type values
#   expected_extension     expected file extension
#   min_bytes              sanity floor to catch truncated/soft-404 payloads
#   fetchable              true = plain HTTP GET will be attempted
#   skip_reason            required when fetchable is false
#   notes                  free text - license caveats, provenance, etc.

# ============================================================
# VOCABULARY - green (bypasses LLM/chunking, feeds Definition nodes)
# ============================================================

